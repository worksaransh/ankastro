version: '3.8'

services:
  # Nginx Gateway & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ankjyotish_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./project/dist:/var/www/frontend:ro
    depends_on:
      - laravel-app
      - python-intelligence

  # Laravel Main Business Core
  laravel-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ankjyotish_laravel
    restart: unless-stopped
    environment:
      APP_NAME: "AnkJyotish AI"
      APP_ENV: production
      APP_KEY: base64:your_production_app_key_here
      APP_DEBUG: "false"
      APP_URL: "https://ankjyotishai.com"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ankjyotish
      DB_USERNAME: ankjyotish_user
      DB_PASSWORD: ankjyotish_secure_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHON_ENGINE_URL: "http://python-intelligence:8000/api/v1"
      INTERNAL_API_SECRET: "ankjyotish_super_secret_internal_key_2026"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - postgres
      - redis

  # Python Intelligence Layer (FastAPI)
  python-intelligence:
    build:
      context: .
      dockerfile: python/Dockerfile
    container_name: ankjyotish_python_engine
    restart: unless-stopped
    environment:
      INTERNAL_API_SECRET: "ankjyotish_super_secret_internal_key_2026"
      REDIS_URL: "redis://redis:6379/0"
      GROQ_API_KEY: "${GROQ_API_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
    ports:
      - "8000:8000"
    depends_on:
      - redis

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ankjyotish_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ankjyotish
      POSTGRES_USER: ankjyotish_user
      POSTGRES_PASSWORD: ankjyotish_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  # Redis Cache & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: ankjyotish_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Laravel Queue Worker
  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ankjyotish_queue_worker
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    depends_on:
      - laravel-app
      - redis

volumes:
  postgres_data:
  redis_data:
