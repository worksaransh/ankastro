<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e0c38" />
      <stop offset="100%" stop-color="#080312" />
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.6" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#purpleGrad)" stroke-width="4" stroke-dasharray="8 8" opacity="0.8" />

  <!-- 8-Pointed Star / Yantra Geometry -->
  <g filter="url(#glow)">
    <!-- Square 1 -->
    <rect x="136" y="136" width="240" height="240" rx="32" fill="none" stroke="url(#goldGrad)" stroke-width="12" />
    <!-- Square 2 (Rotated 45 deg) -->
    <rect x="136" y="136" width="240" height="240" rx="32" fill="none" stroke="url(#goldGrad)" stroke-width="12" transform="rotate(45 256 256)" />
  </g>

  <!-- Center Sun Symbol -->
  <circle cx="256" cy="256" r="64" fill="url(#goldGrad)" />
  
  <!-- Rays -->
  <g stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round">
    <line x1="256" y1="140" x2="256" y2="170" />
    <line x1="256" y1="342" x2="256" y2="372" />
    <line x1="140" y1="256" x2="170" y2="256" />
    <line x1="342" y1="256" x2="372" y2="256" />
    <line x1="174" y1="174" x2="195" y2="195" />
    <line x1="317" y1="317" x2="338" y2="338" />
    <line x1="174" y1="338" x2="195" y2="317" />
    <line x1="317" y1="195" x2="338" y2="174" />
  </g>

  <!-- Center Sparkle -->
  <polygon points="256,216 268,244 296,256 268,268 256,296 244,268 216,256 244,244" fill="#ffffff" />
</svg>
